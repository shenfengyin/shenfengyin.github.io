title: SHENFY BLOG
subtitle: ''
description: 记录博主日常学习记录，包括后端、大数据相关开发知识，后续会陆续更新机器学习的部分~~
keywords:
  - 后端开发
  - 大数据
  - 机器学习
author: Shen Fengyin
language: zh-CN
timezone: Asia/Shanghai

url: https://shenfengyin.github.io
permalink: :year/:month/:day/:title/
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: null

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: null
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

default_category: uncategorized
category_map: null
tag_map: null
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null

theme: butterfly

deploy:
  type: git
  repo: git@github.com:shenfengyin/shenfengyin.github.io.git
  branch: master
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
